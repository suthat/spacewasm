name: Perf probe

# Throwaway workflow. The first pass established that ubuntu-latest exposes no
# PMU while ubuntu-24.04-arm exposes armv8_pmuv3_0. This pass asks whether a
# hardware instruction count on the ARM runner is repeatable enough to compare
# two builds: within one machine, and across two machines.

on:
  workflow_dispatch:
  push:
    branches: [probe-perf]

jobs:
  probe:
    name: Probe (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm-a
            runner: ubuntu-24.04-arm
          - label: arm-b
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -a
          lscpu | head -n 25 || true

      - name: perf as the image ships it
        run: |
          echo "perf preinstalled: $(command -v perf || echo no)"
          echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid)"
          # Counting a process you started yourself needs paranoid <= 2.
          perf stat -e instructions:u true 2>&1 | tail -n 8 || true

      - name: Install perf if needed (timed)
        run: |
          start=$(date +%s.%N)
          if ! command -v perf > /dev/null; then
            sudo apt-get update
            sudo apt-get install --assume-yes --no-install-recommends \
              linux-tools-common linux-tools-generic
          fi
          end=$(date +%s.%N)
          echo "perf install: $(echo "$end - $start" | bc)s"

      - name: Install Valgrind (timed)
        run: |
          start=$(date +%s.%N)
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends valgrind
          end=$(date +%s.%N)
          echo "valgrind install: $(echo "$end - $start" | bc)s"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the bench
        id: build
        run: |
          set -euo pipefail
          exe=$(cargo bench -p spacewasm_std --bench coremark --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact")
                     | select(.target.kind | index("bench"))
                     | select(.target.name == "coremark")
                     | .executable' \
            | tail -n 1)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          sha256sum "$exe"

      - name: Hardware instruction count, ten runs
        run: |
          set -euo pipefail
          exe='${{ steps.build.outputs.exe }}'
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | head -n 1)

          # The image ships paranoid=4, which refuses even to count a process
          # you started yourself. Passwordless sudo is available on the runner.
          sudo sysctl -w kernel.perf_event_paranoid=1

          # User-space only, so kernel work on the runner's behalf does not
          # land in the figure.
          for i in $(seq 1 10); do
            COREMARK_FIXED_CLOCK=1 "$PERF" stat -x, -e instructions:u,task-clock \
              -o "/tmp/perf.$i" "$exe" > /dev/null
            insns=$(awk -F, '$3 == "instructions:u" { print $1 }' "/tmp/perf.$i")
            echo "run $i: $insns"
          done

      - name: Same thing under callgrind, twice, timed
        run: |
          set -euo pipefail
          exe='${{ steps.build.outputs.exe }}'
          for i in 1 2; do
            COREMARK_FIXED_CLOCK=1 /usr/bin/time -f "callgrind run $i: %e s" \
              valgrind --tool=callgrind --cache-sim=no --branch-sim=no \
              --callgrind-out-file="/tmp/cg.$i" "$exe" > /dev/null
            awk '/^(summary|totals):/ { print "Ir: " $2; exit }' "/tmp/cg.$i"
          done

      - name: What a timed sample costs here
        run: |
          set -euo pipefail
          exe='${{ steps.build.outputs.exe }}'
          /usr/bin/time -f "timed sample: %e s" "$exe" | grep -E 'CoreMark Score' || true
